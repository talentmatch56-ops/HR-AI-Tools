version: '3.8'

services:
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: hr-mcp-server
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      - ./mcp-server:/app
      - ./backend/static/docs:/backend/static/docs
      - ./credentials.json:/credentials.json
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hr-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./mcp-server:/mcp-server
      - ./credentials.json:/credentials.json
    depends_on:
      - mcp-server
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hr-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
